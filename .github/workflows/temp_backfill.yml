name: TEMP Backfill Review Summary

on:
  workflow_dispatch:
    inputs:
      date:
        description: "백필할 날짜 (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        run: python backfill_review_summary.py ${{ inputs.date }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: ${{ inputs.date }} 리뷰 백필"
          git pull --rebase
          git push
